<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCEM Campus Navigator</title>
<style>
:root{
  --bg:#eef2f5;--pn:#fff;--tx:#14202b;--mu:#5b6b78;--ac:#0b6e4f;--bd:#d3dce3;
  --or:#ff6b1a;--or2:#ffb347;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720;--pn:#18232e;--tx:#e8eef3;--mu:#9bacba;--ac:#3ecf9b;--bd:#2c3b48;
  --or:#ff8c44;--or2:#ffc87a;
}}
:root[data-theme="dark"]{
  --bg:#0f1720;--pn:#18232e;--tx:#e8eef3;--mu:#9bacba;--ac:#3ecf9b;--bd:#2c3b48;
  --or:#ff8c44;--or2:#ffc87a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ── Left sidebar ── */
#ui{
  position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));
  width:min(320px,calc(100% - 20px));max-height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;overflow-x:hidden;
  background:var(--pn);border:1px solid var(--bd);border-radius:12px;
  padding:10px;box-shadow:0 4px 18px #0003;
  display:flex;flex-direction:column;gap:6px;
}
#ui h2{margin:0;font-size:14px;font-weight:700;white-space:nowrap}
input{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;outline:none}
input:focus{border-color:var(--ac)}
button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:7px;padding:5px 9px;font:inherit;cursor:pointer;transition:background .15s}
button:hover{background:var(--bd)}
button.on,button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on:hover,button.p:hover{background:var(--ac);filter:brightness(1.1)}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
small,#inf{color:var(--mu);font-size:11px}
#inf{min-height:1.3em}

/* floor buttons */
#fl button{padding:4px 8px;font-size:12px;min-width:30px}
#fl button.on{background:var(--ac);color:#fff}
#fl button.dim{opacity:.45}

/* directions panel */
#dirs-wrap{overflow-y:auto;max-height:220px;border-top:1px solid var(--bd);padding-top:6px;display:none}
#dirs-wrap.show{display:block}
#dirs{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}
#dirs li{
  display:flex;align-items:flex-start;gap:6px;
  padding:5px 7px;border-radius:7px;cursor:pointer;
  font-size:12px;line-height:1.4;
  border:1px solid transparent;
  transition:background .12s;
}
#dirs li:hover{background:var(--bg)}
#dirs li.active{background:#ff6b1a22;border-color:var(--or);color:var(--or)}
#dirs li .step-icon{font-size:15px;flex-shrink:0;margin-top:1px}
#dirs li .step-num{font-weight:700;flex-shrink:0;min-width:18px;color:var(--mu);font-size:11px}
#dirs li .step-dist{color:var(--mu);font-size:10px;margin-left:auto;white-space:nowrap;padding-left:4px}

/* legend */
#leg{border-top:1px solid var(--bd);padding-top:6px}
#leg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;border:1px solid #0001}

/* ── Compass ── */
#compass{
  position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));
  width:58px;height:58px;pointer-events:none;
}
#compass svg{width:100%;height:100%;filter:drop-shadow(0 2px 5px #0006)}

#inf{color:var(--mu);font-size:12px;line-height:1.5;min-height:1.4em;margin:2px 0}
#inf b{color:var(--tx);font-weight:700}
#inf button{padding:3px 7px;font-size:11px;margin-left:4px;vertical-align:middle}

/* ── Hint bar ── */
#hint{position:fixed;left:10px;bottom:calc(6px + env(safe-area-inset-bottom,0px));color:var(--mu);font-size:10px;pointer-events:none}

/* collapse button */
#col-btn{padding:3px 8px;font-size:12px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- LEFT SIDEBAR -->
<div id="ui">
  <div class="row" style="justify-content:space-between;margin:0">
    <h2>🏫 SCEM Campus Navigator</h2>
    <button id="col-btn" title="Collapse panel">–</button>
  </div>
  <!-- Campus Map shortcut banner -->
  <a href="campus-map.html" target="_blank" style="
      display:flex;align-items:center;gap:8px;padding:7px 10px;
      background:linear-gradient(135deg,#0b6e4f,#1aab78);
      color:#fff;border-radius:8px;text-decoration:none;font-size:12px;font-weight:600;
      border:none;cursor:pointer;">
    🗺️ Open Full Campus Map
    <span style="margin-left:auto;opacity:.75;font-size:10px">outdoor →</span>
  </a>
  <div id="ui-body">
    <input id="fr" list="rl" placeholder="From (blank = Main Entry)" autocomplete="off">
    <input id="to" list="rl" placeholder="To: room, lab, office, library…" autocomplete="off">
    <div class="row">
      <button class="p" id="go">🗺 Route</button>
      <button id="cl">✕ Clear</button>
      <button id="tp">⬆ Top view</button>
      <button id="fw">▶ Walk</button>
    </div>
    <!-- floor selector -->
    <div class="row" id="fl"></div>
    <!-- nearest quick-buttons -->
    <div class="row">
      <small>Nearest:</small>
      <span id="ch" class="row" style="margin:0"></span>
    </div>
    <!-- info line -->
    <div id="inf"></div>
    <!-- step-by-step directions -->
    <div id="dirs-wrap">
      <small style="font-weight:600">Step-by-step directions</small>
      <ol id="dirs"></ol>
    </div>
    <!-- legend -->
    <div id="leg">
      <small style="font-weight:600">Legend</small>
      <div id="leg-grid"></div>
    </div>
    <small style="color:var(--mu);font-size:10px">Schematic – not to scale. Stair positions approximate. Distances are estimates.</small>
  </div>
</div>
<datalist id="rl"></datalist>

<!-- COMPASS ROSE -->
<div id="compass">
  <svg id="compass-svg" viewBox="0 0 58 58" xmlns="http://www.w3.org/2000/svg">
    <circle cx="29" cy="29" r="27" fill="#ffffffcc" stroke="#aaa" stroke-width="1"/>
    <!-- N needle red -->
    <polygon points="29,5 33,29 25,29" fill="#d63031"/>
    <!-- S needle grey -->
    <polygon points="29,53 33,29 25,29" fill="#636e72"/>
    <!-- W/E ticks -->
    <line x1="5" y1="29" x2="11" y2="29" stroke="#636e72" stroke-width="1.5"/>
    <line x1="47" y1="29" x2="53" y2="29" stroke="#636e72" stroke-width="1.5"/>
    <text x="29" y="17" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="700" fill="#d63031">N</text>
    <text x="29" y="47" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#636e72">S</text>
    <text x="9" y="31" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#636e72">W</text>
    <text x="49" y="31" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#636e72">E</text>
  </svg>
</div>

<div id="hint">Drag: rotate · Wheel/pinch: zoom · Shift-drag: pan · Tap room · 🟡 = avatar on route · 🟠 = path</div>

const pos=c=>[(c%GW)*S+S/2,(c/GW|0)*S+S/2];

// ── Nearest walkable cell within expanding ring around (px,py) ────────
function nearestWalkable(f,px,py,maxR){
  const cx=Math.round((px-S/2)/S),cy=Math.round((py-S/2)/S);
  for(let r=0;r<=maxR;r++){
    let best=-1,bd=1e9;
    for(let dy2=-r;dy2<=r;dy2++)for(let dx2=-r;dx2<=r;dx2++){
      if(r>0&&Math.abs(dx2)!==r&&Math.abs(dy2)!==r)continue;
      const nx=cx+dx2,ny=cy+dy2;
      if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
      const cc=ny*GW+nx;
      if(!base[f][cc])continue;
      const d2=dx2*dx2+dy2*dy2;
      if(d2<bd){bd=d2;best=cc}
    }
    if(best>=0)return best;
  }
  return -1;
}

// doors — Strategy 1: find corridor cell adjacent to room boundary
//         Strategy 2: nearestWalkable from room center (fallback for isolated rooms)
for(let f=0;f<NF;f++)door[f]=D.R[f].map((r,i)=>{
  let best=null,bd=1e9;const cx=r[0]+r[2]/2,cy=r[1]+r[3]/2;
  // Strategy 1
  for(let c=0;c<N;c++){
    if(own[f][c]!=i)continue;
    const x=c%GW,y=c/GW|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
      const m=ny*GW+nx;if(!base[f][m]||own[f][m]==i)continue;
      const px=(x+.5+dx/2)*S,py=(y+.5+dy/2)*S,d=Math.hypot(px-cx,py-cy);
      if(d<bd){bd=d;best={c:m,dx,dy,x:dx?(dx>0?r[0]+r[2]-1:r[0]+1):px,y:dy?(dy>0?r[1]+r[3]-1:r[1]+1):py}};
    }
  }
  if(best)return best;
  // Strategy 2 — expand outward up to 25 cells from room center
  const fc=nearestWalkable(f,cx,cy,25);
  if(fc>=0){const[px2,py2]=pos(fc);return{c:fc,dx:0,dy:0,x:cx,y:cy};}
  return null;
});

// snap cores to nearest walkable cell using nearestWalkable()
CORES.forEach(K=>{
  K.c=[];
  for(let f=0;f<NF;f++){
    K.c[f]=(f>=K.f[0]&&f<=K.f[1])?nearestWalkable(f,K.x,K.y,20):-1;
  }
});

// ══════════════════════════════════════════════════
//  PATHFINDING
// ══════════════════════════════════════════════════
function los(f,a,b){
  const n=Math.ceil(Math.hypot(b[1]-a[1],b[2]-a[2])/(S/2));
  for(let i=1;i<n;i++){const t=i/n;if(!base[f][cellAt(a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t)])return false}
  return true;
}
function smooth(seg){
  const f=seg[0][0],o=[seg[0]];let i=0;
  while(i<seg.length-1){let j=seg.length-1;while(j>i+1&&!los(f,seg[i],seg[j]))j--;o.push(seg[j]);i=j}
  return o;
}
function dj(sf,sc,tg){
  if(sc<0)return null;
  const dist=new Float64Array(NF*N).fill(1e9),prev=new Int32Array(NF*N).fill(-1);
  const visited=new Uint8Array(NF*N);
  const hk=[],hn=[];
  const push=(k,n)=>{let i=hk.length;hk.push(k);hn.push(n);while(i>0){const p=(i-1)>>1;if(hk[p]<=hk[i])break;[hk[p],hk[i]]=[hk[i],hk[p]];[hn[p],hn[i]]=[hn[i],hn[p]];i=p}};
  const pop=()=>{const k=hk[0],n=hn[0],lk=hk.pop(),ln=hn.pop();if(hk.length){hk[0]=lk;hn[0]=ln;let i=0;for(;;){const a=2*i+1,b=a+1;let m=i;if(a<hk.length&&hk[a]<hk[m])m=a;if(b<hk.length&&hk[b]<hk[m])m=b;if(m==i)break;[hk[m],hk[i]]=[hk[i],hk[m]];[hn[m],hn[i]]=[hn[i],hn[m]];i=m}}return[k,n]};
  const s=sf*N+sc;dist[s]=0;push(0,s);
  while(hk.length){
    const[k,n]=pop();
    if(visited[n])continue;
    visited[n]=1;
    const f=n/N|0,c=n%N;
    if(tg.has(n)){
      const a=[];for(let m=n;m>=0;m=prev[m])a.push(m);
      return{key:tg.get(n),pts:a.reverse().map(m=>{const q=m%N;return[m/N|0,(q%GW)*S+S/2,(q/GW|0)*S+S/2]})};
    }
    const x=c%GW,y=c/GW|0;
    const rel=(m,w)=>{
      if(!visited[m]&&k+w<dist[m]){dist[m]=k+w;prev[m]=n;push(k+w,m)}
    };
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      if(!dx&&!dy)continue;
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
      const m=ny*GW+nx;if(!base[f][m])continue;
      if(dx&&dy&&(!base[f][y*GW+nx]||!base[f][ny*GW+x]))continue;
      rel(f*N+m,(dx&&dy?1.414:1)*S);
    }
    CORES.forEach(K=>{
      if(K.c[f]==c)[-1,1].forEach(d=>{
        const g=f+d;
        if(g>=0&&g<NF&&K.c[g]>=0)rel(g*N+K.c[g],40);
      });
    });
  }
  return null;
}

function slab(g,pts,col,dep,holes){

  const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:dep,bevelEnabled:false}),new THREE.MeshLambertMaterial({color:col}));
  m.rotation.x=-Math.PI/2;m.position.y=-dep;g.add(m);
}
function merged(L,color){
  const P=[],Nn=[],I=[];let o=0;
  L.forEach(([x,y,z,w,h,d])=>{const b=new THREE.BoxGeometry(w,h,d);b.translate(x,y,z);P.push(...b.attributes.position.array);Nn.push(...b.attributes.normal.array);I.push(...Array.from(b.index.array,v=>v+o));o+=b.attributes.position.count});
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(Nn,3));g.setIndex(I);
  return new THREE.Mesh(g,new THREE.MeshLambertMaterial({color}));
}
function edge(L,a,b,gap,t,h){
  const H=a[1]==b[1];let s=H?a[0]:a[1],e=H?b[0]:b[1];if(s>e)[s,e]=[e,s];let cur=s;
  const add=(u,v)=>{if(v-u<1)return;const c=(u+v)/2,l=v-u+t;L.push(H?[c-450,h/2,a[1]-660,l,h,t]:[a[0]-450,h/2,c-660,t,h,l])};
  if(gap){add(cur,Math.max(cur,gap-8));cur=Math.min(e,gap+8)}add(cur,e);
}

}

    edge(W,[X0,Y0],[X1,Y0],G(0,-1),2,WH);edge(W,[X0,Y1],[X1,Y1],G(0,1),2,WH);edge(W,[X0,Y0],[X0,Y1],G(-1,0),2,WH);edge(W,[X1,Y0],[X1,Y1],G(1,0),2,WH);

// ── labels ──────────────────────────────────────────────────────────────
// style: 'normal' | 'dim' | 'start' (green pill) | 'dest' (orange pill)
function makeSpriteCanvas(t, style) {
  const c = document.createElement('canvas');
  c.width = 300;
  c.height = 60;
  const ctx = c.getContext('2d');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  let s = t;
  ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
  while (ctx.measureText(s).width > 275 && s.length > 3) s = s.slice(0, -2);
  if (s !== t) s += '…';

  const w = 300, h = 60;
  const rx = 10;

  if (style === 'dest') {
    // Highlighted destination pill: Warm, elegant terracotta/amber (not extreme)
    ctx.fillStyle = '#ea580c';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(3, 4, w - 6, h - 8, rx); ctx.fill(); }
    else ctx.fillRect(3, 4, w - 6, h - 8);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.5;
    if (ctx.roundRect) { ctx.stroke(); }
    ctx.fillStyle = '#ffffff';
    ctx.fillText(s, w / 2, h / 2);
  } else if (style === 'start') {
    // Highlighted origin pill: Fresh, elegant university green
    ctx.fillStyle = '#15803d';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(3, 4, w - 6, h - 8, rx); ctx.fill(); }
    else ctx.fillRect(3, 4, w - 6, h - 8);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.5;
    if (ctx.roundRect) { ctx.stroke(); }
    ctx.fillStyle = '#ffffff';
    ctx.fillText(s, w / 2, h / 2);
  } else if (style === 'dim') {
    // During active navigation: very faint soft neutral pill
    ctx.fillStyle = 'rgba(240, 245, 250, 0.35)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(3, 4, w - 6, h - 8, rx); ctx.fill(); }
    else ctx.fillRect(3, 4, w - 6, h - 8);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
    ctx.lineWidth = 1;
    if (ctx.roundRect) { ctx.stroke(); }
    ctx.fillStyle = 'rgba(51, 65, 85, 0.45)';
    ctx.fillText(s, w / 2, h / 2);
  } else {
    // Normal: Light, soft, elegant pearl/slate pill — NOT black! NOT dark!
    ctx.fillStyle = 'rgba(248, 250, 252, 0.9)';
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(3, 4, w - 6, h - 8, rx); ctx.fill(); }
    else ctx.fillRect(3, 4, w - 6, h - 8);
    ctx.strokeStyle = 'rgba(100, 116, 139, 0.45)';
    ctx.lineWidth = 1.5;
    if (ctx.roundRect) { ctx.stroke(); }
    ctx.fillStyle = '#1e293b';
    ctx.fillText(s, w / 2, h / 2);
  }
  return c;
}

// labMap[f] = array of {sp, rawText, ri} — one entry per room on floor f with a label
const labMap = [];

function spr(g, t, x, y, w0, yy, style) {
  style = style || 'normal';
  const c = makeSpriteCanvas(t, style);
  const isHL = style === 'start' || style === 'dest';
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c),
    depthTest: false,
    transparent: true,
    opacity: style === 'dim' ? 0.14 : (isHL ? 1.0 : 0.75)
  }));
  // Compact, unobtrusive scale so labels NEVER cover the 3D building or route!
  const baseW = isHL ? Math.max(46, Math.min(76, w0 * 0.7)) : Math.max(26, Math.min(48, w0 * 0.38));
  sp.scale.set(baseW, baseW / 5.2, 1);
  sp.position.set(x-450, yy, y-660);
  sp.renderOrder = isHL ? 14 : 4;
  g.add(sp);
  return sp;
}

function mkLab(f) {
  const g = new THREE.Group(); gr[f].add(g); lab[f] = g;
  labMap[f] = [];
  D.R[f].forEach((r, ri) => {
    if (!r[5] && !r[4]) return;
    const txt = (r[4] ? r[4] + ' ' : '') + r[5];
    const sp = spr(g, txt, r[0]+r[2]/2, r[1]+r[3]/2, r[2]*1.4, RH+8, 'normal');
    labMap[f].push({sp, txt, ri, rx: r[0]+r[2]/2, ry: r[1]+r[3]/2, w: r[2]*1.4});
  });
  CORES.forEach(K => { if (K.c[f] >= 0) { const[x,y]=pos(K.c[f]); spr(g,'⇅ Stairs '+K.n,x,y,65,22,'normal'); } });
}

// Update label styles for a floor based on which rooms are start/dest
// startKey = f*1000+i of start room, destKey = f*1000+i of dest room (or -1)
function refreshLabels(f, startKey, destKey) {
  if (!labMap[f]) return;
  labMap[f].forEach(({sp, txt, ri, rx, ry, w}) => {
    const key = f * 1000 + ri;
    let style = 'dim';
    if (key === startKey) style = 'start';
    else if (key === destKey) style = 'dest';
    const c = makeSpriteCanvas(txt, style);
    sp.material.map = new THREE.CanvasTexture(c);
    sp.material.map.needsUpdate = true;
    
    // Highlighted nodes get full opacity & prominent size; all others drop to low opacity (0.14)
    if (style === 'start' || style === 'dest') {
      sp.material.opacity = 1.0;
      const hw = Math.max(48, Math.min(80, w * 0.72));
      sp.scale.set(hw, hw / 5.0, 1);
      sp.renderOrder = 14;
    } else {
      sp.material.opacity = 0.14;
      const dw = Math.max(22, Math.min(38, w * 0.3));
      sp.scale.set(dw, dw / 5.2, 1);
      sp.renderOrder = 2;
    }
    sp.material.needsUpdate = true;
  });
}

// Reset all labels to normal on all built floors
function resetAllLabels() {
  labMap.forEach((entries, f) => {
    if (!entries) return;
    entries.forEach(({sp, txt, rx, ry, w}) => {
      const c = makeSpriteCanvas(txt, 'normal');
      sp.material.map = new THREE.CanvasTexture(c);
      sp.material.map.needsUpdate = true;
      sp.material.opacity = 0.75;
      const nw = Math.max(26, Math.min(48, w * 0.38));
      sp.scale.set(nw, nw / 5.2, 1);
      sp.renderOrder = 4;
      sp.material.needsUpdate = true;
    });
  });
}

  wp.push(H(pts[0]));fi.push(pts[0][0]);pi.push(0);

  for(let i=1;i<pts.length;i++){
    const a=H(pts[i-1]),b=H(pts[i]);
    const L=a.distanceTo(b);
    const n=Math.max(1,Math.ceil(L/5));
    const f0=pts[i-1][0],f1=pts[i][0];
    for(let k=1;k<=n;k++){wp.push(a.clone().lerp(b,k/n));fi.push(k*2>n?f1:f0)}
    pi.push(wp.length-1);

    const isFloorChange=f0!=f1;
    const dir=b.clone().sub(a).normalize();

    if(isFloorChange){
      // Vertical connector — bright orange thick cylinder
      const vc=new THREE.Mesh(new THREE.CylinderGeometry(5,5,L,10),stairMat);
      vc.position.copy(a).add(b).multiplyScalar(.5);
      vc.quaternion.setFromUnitVectors(V3(0,1,0),dir);
      vc.userData={f:f0,f2:f1};vc.renderOrder=20;scene.add(vc);RT.push(vc);
    } else {
      // Thick orange tube (radius 3.5)
      const tube=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.5,L,10),tubeMat);
      tube.position.copy(a).add(b).multiplyScalar(.5);
      tube.quaternion.setFromUnitVectors(V3(0,1,0),dir);
      tube.userData={f:f0,f2:f0};tube.renderOrder=20;scene.add(tube);RT.push(tube);
      // White directional arrow cones every ~50 units
      for(let t=30;t<L;t+=50){
        const cone=new THREE.Mesh(new THREE.ConeGeometry(5,14,8),arrowMat);
        cone.position.copy(a).lerp(b,t/L);
        cone.position.y+=4;
        cone.quaternion.setFromUnitVectors(V3(0,1,0),dir);
        cone.userData={f:f0,f2:f0};cone.renderOrder=21;
        scene.add(cone);RT.push(cone);
      }
    }
  }
  mt=0;mv.visible=true;updRT();
}

// ══════════════════════════════════════════════════
//  STEP-BY-STEP DIRECTIONS
// ══════════════════════════════════════════════════
const CD=['north','north-east','east','south-east','south','south-west','west','north-west'];
const TN=['Continue straight','Bear right','Turn right','Turn sharp right','Turn around','Turn sharp left','Turn left','Bear left'];
const hd=(a,b)=>((Math.round(Math.atan2(b[1]-a[1],-(b[2]-a[2]))/(Math.PI/4))%8)+8)%8;

function land(f,x,y,ex){
  let bn=null,bd=40;
  D.R[f].forEach((r,j)=>{
    if(!r[5]||ex.includes(f*1000+j))return;
    const dx=Math.max(r[0]-x,0,x-r[0]-r[2]),dy=Math.max(r[1]-y,0,y-r[1]-r[3]),d=Math.hypot(dx,dy);
    if(d<bd){bd=d;bn=r[5]+(r[4]?' '+r[4]:'')}
  });
  return bn;
}

function steps(pts,startName,endName,ex){
  const legs=[];
  for(let i=1;i<pts.length;i++){
    const p=pts[i-1],q=pts[i];
    if(p[0]!=q[0]){legs.push({st:1,f:q[0],up:q[0]>p[0],i,x:q[1],y:q[2]});continue}
    const len=Math.hypot(q[1]-p[1],q[2]-p[2]);if(!len)continue;
    const h=hd(p,q),L=legs[legs.length-1];
    if(L&&!L.st&&L.f==p[0]&&(len<20||h==L.h)){L.len+=len;L.x=q[1];L.y=q[2];L.i=i}
    else legs.push({f:p[0],h,len,x:q[1],y:q[2],i});
  }

  // Build steps array: [icon, text, ptIndex, distText]
  const out=[];
  out.push({icon:'🚶',text:`Start at: ${startName}`,ptIdx:0,dist:''});
  let ph0=-1,tot=0,flChanges=0;

  legs.forEach((L,k)=>{
    if(L.st){
      flChanges++;
      const K=CORES.reduce((u,v)=>{
        const d=c=>{if(c.c[L.f]<0)return 1e9;const[x,y]=pos(c.c[L.f]);return Math.hypot(x-L.x,y-L.y)};
        return d(v)<d(u)?v:u;
      });
      out.push({icon:'🪜',text:`Take Stairs ${K.n} ${L.up?'up':'down'} to the ${FL[L.f]} floor`,ptIdx:L.i,dist:''});
      ph0=-1;return;
    }
    const m=Math.max(1,Math.round(L.len*MPP));tot+=L.len;
    const last=k==legs.length-1;
    const ln=last?null:land(L.f,L.x,L.y,ex);
    const dir=ph0<0?(k==0?'Exit and head '+CD[L.h]:'Head '+CD[L.h]):TN[(L.h-ph0+8)%8];
    const near=ln?`, near ${ln}`:'';
    out.push({icon:'🚶',text:`${dir}${near}`,ptIdx:L.i,dist:`≈${m} m`});
    ph0=L.h;
  });

  const p=pts[pts.length-3]||pts[0],d2=pts[pts.length-2],c2=pts[pts.length-1];
  const side=(d2[1]-p[1])*(c2[2]-d2[2])-(d2[2]-p[2])*(c2[1]-d2[1])>0?'right':'left';
  out.push({icon:'🏁',text:`Arrive: ${endName} — door on your ${side}`,ptIdx:pts.length-1,dist:''});

  const totalM=Math.round(tot*MPP);
  $('inf').textContent=`≈${totalM} m · ~${Math.max(1,Math.round(totalM/72+flChanges/3))} min walk${flChanges?` · ${flChanges} floor change${flChanges>1?'s':''}`:''}.`;

  const dirsEl=$('dirs');
  dirsEl.innerHTML='';
  out.forEach((step,idx)=>{
    const li=document.createElement('li');
    const numSpan=`<span class="step-num">${idx+1}</span>`;
    const iconSpan=`<span class="step-icon">${step.icon}</span>`;
    const textSpan=`<span style="flex:1">${step.text}</span>`;
    const distSpan=step.dist?`<span class="step-dist">${step.dist}</span>`:'';
    li.innerHTML=numSpan+iconSpan+textSpan+distSpan;
    li.dataset.idx=idx;
    li.onclick=()=>{
      // Jump camera to waypoint
      const rawPtIdx=step.ptIdx;
      const clampedIdx=Math.min(rawPtIdx,pi.length-1);
      const wpIdx=pi[clampedIdx]||0;
      mt=wpIdx;
      const f=fi[Math.min(wpIdx,fi.length-1)];
      setView(f>=0?f:0);
      if(wp[wpIdx]){tg.x=wp[wpIdx].x;tg.z=wp[wpIdx].z;tg.y=wp[wpIdx].y;}
      // highlight active step
      [...dirsEl.children].forEach(c=>c.classList.remove('active'));
      li.classList.add('active');
    };
    dirsEl.appendChild(li);
  });
  $('dirs-wrap').classList.add('show');
}

// ══════════════════════════════════════════════════
//  ROUTE MAIN FUNCTION
// ══════════════════════════════════════════════════
function route(fo,tk){
  clr();
  let sf,sc,s0,pre=[];
  if(fo.e){
    // Main Entry — find nearest walkable cell to entrance area on Ground floor
    sf=0;
    sc=nearestWalkable(0,450,1190,40); // centre-bottom of Ground floor
    if(sc<0)sc=nearestWalkable(0,450,700,40); // fallback mid-floor
    const[ex,ey]=sc>=0?pos(sc):[450,1190];
    s0=[0,ex,ey];
  } else {
    const r=D.R[fo.f][fo.i],d=door[fo.f][fo.i];
    if(!d){
      // last-resort: find any walkable cell near room center
      const cx=r[0]+r[2]/2,cy=r[1]+r[3]/2;
      const fc=nearestWalkable(fo.f,cx,cy,30);
      if(fc<0){$('inf').textContent='Start room is isolated — cannot find exit.';return}
      sf=fo.f;sc=fc;s0=[fo.f,cx,cy];pre=[];
    } else {
      sf=fo.f;sc=d.c;s0=[fo.f,r[0]+r[2]/2,r[1]+r[3]/2];pre=[[fo.f,d.x,d.y]];
    }
  }
  if(sc<0){$('inf').textContent='Could not find a walkable start cell.';return}
  const tm=new Map();
  tk.forEach(k=>{
    const tf=k/1000|0,ti=k%1000;
    const d=door[tf][ti];
    if(d&&d.c>=0)tm.set(tf*N+d.c,k);
    else{
      // fallback: use nearestWalkable from destination room center
      const r=D.R[tf][ti],cx=r[0]+r[2]/2,cy=r[1]+r[3]/2;
      const fc=nearestWalkable(tf,cx,cy,30);
      if(fc>=0)tm.set(tf*N+fc,k);
    }
  });
  if(tm.size===0){$('inf').textContent='Destination has no reachable cell.';return}
  const r=dj(sf,sc,tm);
  if(!r){$('inf').textContent='No route found — rooms may be on disconnected sections.';return}
  const f=r.key/1000|0,i=r.key%1000,R=D.R[f][i],d=door[f][i],runs=[];
  let cur=[];
  r.pts.forEach((p,j)=>{if(j&&p[0]!=r.pts[j-1][0]){runs.push(cur);cur=[]}cur.push(p)});
  runs.push(cur);
  const pts=[s0,...pre];
  runs.forEach((ru,j)=>{
    if(j){
      const a=runs[j-1].at(-1),b=ru[0];
      pts.push([a[0],a[1]+(a[0]<b[0]?18:-18),a[2]],[b[0],b[1]+(b[0]>a[0]?18:-18),b[2]]);
    }
    pts.push(...smooth(ru));
  });
  const destDoor=door[f][i];
  if(destDoor){pts.push([f,destDoor.x,destDoor.y]);}
  pts.push([f,R[0]+R[2]/2,R[1]+R[3]/2]);
  const ex=[f*1000+i];if(!fo.e)ex.push(fo.f*1000+fo.i);
  const startKey=fo.e ? -1 : fo.f*1000+fo.i;
  const destKey=f*1000+i;
  activeStartKey=startKey; activeDestKey=destKey;   // persist for floor-switch re-apply
  if(!fo.e)paint(fo.f,fo.i,'#4caf50');
  paint(f,i,'#ff8a00');
  draw(pts);
  steps(pts,nm(fo),R[5]||'Space',ex);
  const fs=[...new Set(pts.map(p=>p[0]))];
  if(fs.length>1)setView(-1);
  else setView(fs[0]);
  $('to').value=`${R[5]}${R[4]?' '+R[4]:''} · ${FL[f]}`;
  // Dim all labels and highlight only start + destination
  fs.forEach(flr => {
    if(!lab[flr]) mkLab(flr);
    refreshLabels(flr, startKey, destKey);
  });
}

// ══════════════════════════════════════════════════
//  NEAREST
// ══════════════════════════════════════════════════
function nearest(c){
  const a=find($('fr').value)||IDX[0];
  const k=new Set();
  D.R.forEach((rs,f)=>rs.forEach((r,i)=>{if(r[6]==c&&r[5]&&!(a.f==f&&a.i==i))k.add(f*1000+i)}));
  route(a,k);
}

// ══════════════════════════════════════════════════
//  BUTTON EVENTS
// ══════════════════════════════════════════════════
$('go').onclick=()=>{
  const toVal=$('to').value.trim();
  if(!toVal){$('inf').textContent='Please type a destination room.';return}
  const a=find($('fr').value)||IDX[0]; // default to Main Entry if From is blank
  const b=find(toVal);
  if(!b){$('inf').textContent=`Cannot find "${toVal}" — try a room name or number.`;return}
  if(b.e){$('inf').textContent='Main Entry cannot be a destination. Pick a room.';return}
  if(!a.e&&a.f===b.f&&a.i===b.i){$('inf').textContent='You are already there!';return}
  route(a,new Set([b.f*1000+b.i]));
};
$('cl').onclick=()=>{clr();$('to').value=$('fr').value=''};
$('fw').onclick=()=>{if(wp.length<2){$('inf').textContent='Create a route first.';return}setFol(!fol)};
$('tp').onclick=()=>{setFol(false);ph=.15;th=0};
$('col-btn').onclick=()=>{
  const b=$('ui-body');b.hidden=!b.hidden;
  $('col-btn').textContent=b.hidden?'+':'–';
};

// ══════════════════════════════════════════════════
//  ROOM DETAILS DISPLAY
// ══════════════════════════════════════════════════
function showRoomDetails(f,i){
  const R=D.R[f][i];
  $('inf').innerHTML=`<b>${R[4]?R[4]+' ':''}${R[5]||'Space'}</b> · ${CAT[R[6]][0]} · ${FL[f]} floor <button id="sf">From</button> <button class="p" id="st2">Go here</button>`;
  const t=`${R[5]}${R[4]?' '+R[4]:''} · ${FL[f]}`;
  if(R[5]){
    $('sf').onclick=()=>{$('fr').value=t};
    $('st2').onclick=()=>{$('to').value=t;$('go').click();};
  }
}

// ══════════════════════════════════════════════════
//  POINTER / TOUCH CONTROLS
// ══════════════════════════════════════════════════
const ptr=new Map();let mvd=0,pd=0;const cv=$('cv');
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,e);mvd=0;pd=0});
cv.addEventListener('pointermove',e=>{
  const o=ptr.get(e.pointerId);if(!o)return;
  const dx=e.clientX-o.clientX,dy=e.clientY-o.clientY;
  mvd+=Math.abs(dx)+Math.abs(dy);ptr.set(e.pointerId,e);
  if(ptr.size==2){
    const[a,b]=[...ptr.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pd)rd=Math.max(250,Math.min(3200,rd*pd/d));pd=d;
  } else if(e.buttons==2||e.shiftKey){
    setFol(false);const k=rd*.0013;
    tg.x+=-dx*k*Math.cos(th)+dy*k*-Math.sin(th);
    tg.z+=dx*k*Math.sin(th)+dy*k*-Math.cos(th);
  } else {
    if(mvd>6)setFol(false);
    th-=dx*.006;ph=Math.max(.15,Math.min(1.5,ph-dy*.005));
  }
});
cv.addEventListener('pointerup',e=>{
  ptr.delete(e.pointerId);
  if(mvd<6&&!ptr.size){
    const r=cv.getBoundingClientRect();
    const ray=new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),camera);
    const h=ray.intersectObjects(meshes.filter(m=>m.parent.visible))[0];
    if(h){
      const{f,i}=h.object.userData;
      showRoomDetails(f,i);
    }
  }
});
cv.addEventListener('wheel',e=>{e.preventDefault();rd=Math.max(250,Math.min(3200,rd*(1+e.deltaY*.001)))},{passive:false});

// ══════════════════════════════════════════════════
//  RESIZE & INITIAL VIEW
// ══════════════════════════════════════════════════
function rs(){rd0.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
setView(-1);

// ══════════════════════════════════════════════════
//  URL PARAMETER & CROSS-WINDOW ROUTE HANDOFF
// ══════════════════════════════════════════════════
function applyUrlRoute() {
  try {
    const params = new URLSearchParams(window.location.search);
    const qFrom = params.get('from');
    const qTo = params.get('to');
    if (qFrom) $('fr').value = qFrom;
    if (qTo) {
      $('to').value = qTo;
      setTimeout(() => {
        if ($('go')) $('go').click();
      }, 350);
    }
  } catch (err) {
    console.warn("Could not parse route query params:", err);
  }
}
window.addEventListener('load', applyUrlRoute);
setTimeout(applyUrlRoute, 450);

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'ROUTE') {
    if (e.data.from !== undefined) $('fr').value = e.data.from;
    if (e.data.to) {
      $('to').value = e.data.to;
      $('go').click();
    }
  }
});

// ══════════════════════════════════════════════════
//  RENDER LOOP — animated avatar + pulsing ring
// ══════════════════════════════════════════════════
let pulse=0;
(function loop(){
  requestAnimationFrame(loop);
  if(wp.length>1){
    mt=(mt+.55)%(wp.length-1);
    const i=mt|0,f=fi[i];
    mv.position.lerpVectors(wp[i],wp[Math.min(i+1,wp.length-1)],mt-i);
    mv.visible=view<0||f==view;
    // pulsing ring
    pulse+=0.06;
    const s=1+0.25*Math.sin(pulse);
    avRing.scale.set(s,s,s);
    avRing.material.opacity=0.4+0.3*Math.abs(Math.sin(pulse));
    if(fol){
      const j=Math.min(wp.length-1,i+8),dx=wp[j].x-wp[i].x,dz=wp[j].z-wp[i].z;
      if(dx||dz){let d=Math.atan2(-dx,-dz)-th;th+=Math.atan2(Math.sin(d),Math.cos(d))*.05}
      tg.lerp(mv.position,.12);ph=1;rd=320;
      if(view>=0&&view!=f)setView(f);
    }
  }
  cam();
  rd0.render(scene,camera);
})();
</script>
